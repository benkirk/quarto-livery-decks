# Engine knobs the brand.yml standard has no slot for. Role values are palette names from
# _brand.yml or hex. Geometry is in fractions of the slide; the numbers are the ncar livery's
# (the engine's reference geometry), the lockup aspect is this brand's.
name: cu
extends: null

roles:
  primary-text: black             # text on the gold field
  primary-contrast: accessible-gold   # the brand's gold for small text on white
  accent: cu-gold
  highlight: sky-blue             # a second small-text accent on white: examples, tips, strings
  muted: dark-gray
  surface: light-gold
  warning: cu-gold                # the caution slide's bar; its fill is the derived blend
  dark: black

aspect: "16:9"

signoff:                  # the lockup as the brand's "sign off" at the foot of every slide
  light: cu-color
  dark: cu-color
  aspect: 10.903          # the CU Boulder lockup, viewBox 868.22 x 79.63
  height: 0.04            # one line, so lower than a two-line lockup: 0.27 of the width
  bottom: 0.035
  corner: bottom-left

geometry:                 # fractions of the slide (of its width: margin, tab, full.pad)
  margin: 0.06
  tab: 0.018
  logo:
    corner: none          # no mark top right: the sign-off carries the lockup (the NSI flavor puts its mark top-left)
    height: 0.0644
    top: 0.0533
    aspect: 10.903
    title: 0.09
    section: 0.08
    closing: 0.10
  pagenumber:
    corner: bottom-right  # the reference deck's
  divider:
    top: 0.1333
    bottom: 0.0889
  full:
    pad: 0.025
    floor: 0.075
    caption: 0.06

divider:
  label: Section
  tab: true

art:                      # no wave curves: the title field ends in a straight edge
  content: art/content-flatirons.jpg   # the Flatirons, desaturated, 78% white, contrast 0.8 (Ben's pick;
                                       # reference/notes.md on its source and rights)

installed-fonts:          # the brand's Helvetica Neue where it is installed (Macs, iPhones): the HTML
  base: Helvetica Neue    # deck's local() sources, the PDF under fonts=brand; TeX Gyre Heros otherwise
  headings:               # the condensed headlines, by full and PostScript name
    family: Helvetica Neue
    faces: {bold: [Helvetica Neue Condensed Bold, HelveticaNeue-CondensedBold],
            regular: [Helvetica Neue Condensed Bold, HelveticaNeue-CondensedBold]}

latex:                    # build/livery.sty: the palette's LaTeX color names (black and white
  colors:                 # must not shadow xcolor's)
    cu-gold: CUGold
    black: CUBlack
    dark-gray: CUDarkGray
    light-gray: CULightGray
    accessible-gold: CUAccessibleGold
    sky-blue: CUSkyBlue
    light-gold: CULightGold
    dark-blue: CUDarkBlue
    light-blue: CULightBlue
    white: CUWhite

pptx:
  template: template.pptx
  typeface: Helvetica Neue   # the brand's font by name: Macs have it, Windows substitutes Arial;
                             # no `fonts:` blobs, so embed_fonts.py leaves the deck alone
  scheme:                    # the slot contract (livery_build.py SLOT_ROLES) except the links:
    hlink: accessible-gold   # gold on white is not accessible
    folHlink: sky-blue

type:                      # points on the 13.333 x 7.5 in canvas, as the NSI master deck sets them
  body: 16                 # its body text (12-14 on dense slides: scale= or type-body)
  levels: [16, 14, 13, 12, 11]
  frametitle: 32           # its slide titles, 32 (to 36) bold
  subhead: 20              # its in-body heads ("Vision", "Approach")
  footnote: 9              # "*To date"
  title: 48                # the cover: title 48, date 28 (it has no subtitle: the in-body
  subtitle: 20             # heads' size, so a long one fits the band on one line)
  date: 28
  section: 60              # its dividers ("Backup", "External to CU")
  closing: 48
