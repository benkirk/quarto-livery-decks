# The University of Colorado Boulder brand in Quarto's brand.yml standard, kept strictly
# standard; engine knobs are in livery.yml. Values: colorado.edu/imc/cu-boulder-brand/visual-identity
# (2026). Fonts: the brand's Helvetica Neue is Monotype's and cannot be bundled; TeX Gyre Heros
# (a free Helvetica clone, GUST Font License) stands in for HTML and PDF, see livery.yml pptx.
meta:
  name: University of Colorado Boulder
  link: https://www.colorado.edu

color:
  palette:
    cu-gold: "#CFB87C"            # primary; not accessible as text on white
    black: "#000000"
    dark-gray: "#565A5C"          # CU Dark Gray
    light-gray: "#A2A4A3"         # CU Light Gray
    accessible-gold: "#8D7334"    # small text on white only, never a background
    sky-blue: "#096FAE"           # CUB Sky Blue: text only, calls to action
    light-gold: "#F3F0E9"         # CUB Light Gold
    dark-blue: "#0A3758"          # CUB Dark Blue
    light-blue: "#EEF5F8"         # CUB Light Blue
    white: "#FFFFFF"
  primary: cu-gold
  secondary: dark-gray
  foreground: black
  background: white

typography:
  fonts:
    - family: TeX Gyre Heros
      source: file
      files:
        - path: fonts/texgyreheros-regular.otf
          weight: 400
        - path: fonts/texgyreheros-italic.otf
          weight: 400
          style: italic
        - path: fonts/texgyreheros-bold.otf
          weight: 700
        - path: fonts/texgyreheros-bolditalic.otf
          weight: 700
          style: italic
    - family: TeX Gyre Heros Cn     # the brand's condensed headlines (Helvetica Neue Condensed)
      source: file
      files:
        - path: fonts/texgyreheroscn-regular.otf
          weight: 400
        - path: fonts/texgyreheroscn-italic.otf
          weight: 400
          style: italic
        - path: fonts/texgyreheroscn-bold.otf
          weight: 700
        - path: fonts/texgyreheroscn-bolditalic.otf
          weight: 700
          style: italic
  base: TeX Gyre Heros
  headings: TeX Gyre Heros Cn

logo:
  # the CU Boulder lockup, one line (monogram + "University of Colorado Boulder"), from CU's own
  # web brand assets (cdn.colorado.edu/static/brand-assets/live/images/cu-boulder-logo-text-
  # {black,white}.svg); each SVG is kept beside a PNG (HTML, pptx) and a PDF of the same name
  # (LaTeX finds the vector one), rsvg-convert -h 240 and -f pdf (reference/notes.md)
  images:
    cu-color:
      path: logos/cu-boulder-lockup.png         # gold monogram, black text: light backgrounds
    cu-white:
      path: logos/cu-boulder-lockup-white.png   # gold monogram, white text: black fields
  medium:
    light: cu-color       # on light backgrounds
    dark: cu-color        # the brand field is gold, light enough for the black-text lockup
