# The CU Center for National Security Initiatives, a flavor of cu (livery.yml `extends`): only
# what differs from the University of Colorado Boulder brand. The marks are the center's
# master deck's (reference/notes.md); everything else is cu's.
meta:
  name: Center for National Security Initiatives

logo:
  images:
    nsi-color:              # the NSI lockup, gold mark and dark text: light backgrounds and gold fields
      path: logos/nsi-lockup.png
    nsi-white:              # gold mark and white text: the black title and closing field
      path: logos/nsi-lockup-white.png
    nsi-black:              # one color, black: the gold fields, where the gold mark vanishes; a
      path: logos/nsi-lockup-black.png   # recoloring of nsi-color until NSI supplies its own
    rio-color:              # the Research & Innovation Office lockup (NSI is an RIO center):
      path: logos/rio-lockup.png         # its sign-off, in place of cu's CU Boulder lockup; vector,
    rio-white:              # from RIO's overview PDF (reference/notes.md), the SVG kept beside a
      path: logos/rio-lockup-white.png   # PNG (HTML, pptx) and a PDF (LaTeX); white: text white
  medium:
    light: nsi-color        # the gold fields wear nsi-black and the band's black field nsi-white
                            # (livery.yml marks); dark stays cu's
