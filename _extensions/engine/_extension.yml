title: Engine
author: Benjamin Kirk
version: 26.10.0
quarto-required: ">=1.6.0"   # \pandocbounded (used by engine-beamer.lua) needs pandoc >= 3.2.1
contributes:
  formats:
    beamer:
      # The theme is loaded by engine-beamer.lua (\usetheme[<themeoptions>]{Engine}
      # with the extension directory on LaTeX's \input@path), so nothing is
      # copied next to the document.  Use `themeoptions:` for theme options.
      pdf-engine: xelatex
      aspectratio: 169
      slide-level: 2
      section-titles: true
      # figures (incl. mermaid) are sized in inches; the 16:9 text area is ~5.6in wide
      fig-width: 5.5
      fig-height: 3.5
      highlight-style: ../../liveries/ncar/build/livery.theme   # a project: _livery/build/livery.theme
      filters:
        - quarto          # run after quarto's filters (mermaid images exist by then)
        - engine-beamer.lua
        - linked-images.lua   # [![](x.png)](url): a link line on the slide
        - diagram-dark.lua    # a dark livery: baked mermaid/graphviz PNGs turned to the dark
    revealjs:
      # Slide furniture: engine-revealjs.scss (compiled into the reveal theme); the
      # livery's colors, fonts and logos: its build/livery.css, attached by
      # engine-revealjs.lua.  `livery:` and `themeoptions:` as for beamer.
      theme: [default, engine-revealjs.scss]
      template-partials: [title-slide.html]
      width: 1600          # 16:9 like the pptx and beamer decks; every length
      height: 900          # in the theme is in these slide pixels
      margin: 0            # the slide furniture sits at the paper edge
      center: false
      slide-level: 2
      slide-number: c/t
      hash-type: number
      transition: fade
      transition-speed: fast
      background-transition: fade
      preview-links: auto
      highlight-style: ../../liveries/ncar/build/livery.theme
      menu:
        side: left
        numbers: true
      chalkboard:          # b: whiteboard, c: draw on the slide
        buttons: false     # (drop it for `embed-resources: true`)
      fig-width: 10
      fig-height: 5
      filters:
        - engine-revealjs.lua
        - linked-images.lua
        - diagram-dark.lua
    pptx:
      # pandoc's pptx writer on the livery's template (a project: _livery/template.pptx), then
      # Make.common's post-render scripts (common/utils/). The filters, in this order:
      #   strip-raw-figure  quarto's raw-HTML <figure> wrappers: pandoc counts them as text when
      #                     choosing a layout, demoting a columns slide with a diagram to Comparison
      #   slide-layout      the theme's .center/scale= etc. as a notes line, for slide_layout.py
      #   notes-last        speaker notes before a columns div split the slide; every slide's
      #                     notes move to its end, so any placement is safe
      #   single-body       content after a table or diagram splits the slide; the paragraphs
      #                     after one move into its caption, at the slide's foot (after notes-last)
      #   linked-images     [![](x.png)](url): link_captions.py draws the line (here a no-op)
      #   diagram-dark      a dark livery: baked mermaid/graphviz PNGs turned to the dark
      reference-doc: ../../liveries/ncar/template.pptx
      highlight-style: ../../liveries/ncar/build/livery.theme
      slide-level: 2
      toc: false
      filters:
        - strip-raw-figure.lua
        - slide-layout.lua
        - notes-last.lua
        - single-body.lua
        - linked-images.lua
        - diagram-dark.lua
