# yaml-language-server: $schema=../../_extensions/engine/livery.schema.json
schema: 1
# Engine knobs for the NSI flavor of cu: the center's mark top left, the master deck's band title
# (black field, constellation art, gold band with the campus photo, the two lockups below), the
# deck's satellite photo behind content slides. Numbers are fractions of the slide, measured on
# the deck (reference/notes.md); everything not here is cu's.
name: nsi
extends: cu

signoff:                  # the deck's RIO lockup at the foot, as cu's slot (corner, bottom) has it
  light: rio-color
  dark: rio-color
  aspect: 6.317           # the vector lockup's box, 213.69 x 33.83 pt
  height: 0.05
  bottom: 0.03

geometry:
  logo:
    corner: top-left      # the deck's content slides; the title gives way beside it
    top: 0.04             # the deck's (Lindsay's slide 20): the body starts below it (frametitle.body)
    inset: 0.015          # near the paper's edge, not at the text margin (the deck's 23 px of 1600)
    height: 0.135         # and no title rule to keep clear of (frametitle)
    aspect: 1.830         # the NSI lockup, 1316/719

frametitle:               # the deck's content titles: centred beside the mark, no tab, no hairline
  align: center
  tab: false
  rule: false

title:                    # the deck's title slide (slide 1)
  style: band
  top: 0.276
  bottom: 0.724
  split: 0.62
  logo-height: 0.19       # the deck's 0.198 (its NSI lockup, bottom right)
  signoff-height: 0.11    # the deck's 0.115 (its white RIO lockup, bottom left)

art:
  title: art/constellation.jpg          # the deck's title field picture, 4400x2475 scaled to 1920x1080
  titlegraphic: art/campus.jpg          # the deck's campus photo in the band, for decks that set none
  content: art/content-satellite.jpg    # the deck's pre-faded ISS photo, cropped 16:9

pptx:
  template: template.pptx   # cu's typeface and link slots (pptx.scheme) carry over

marks:                    # the mark and sign-off each field wears, by the field's role
  primary: {logo: nsi-black}                   # the gold fields: the one-color black mark
  dark: {logo: nsi-white, signoff: rio-white}  # the band title's black field and the closing
