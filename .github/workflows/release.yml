# Pushing a tag v* publishes a GitHub Release carrying, per livery under liveries/, one
# Overleaf/pure-LaTeX project zip and one charts bundle (matplotlib in the livery), at the stable
# URLs the README links:
#   https://github.com/benkirk/quarto-livery-decks/releases/latest/download/<name>-overleaf.zip
#   https://github.com/benkirk/quarto-livery-decks/releases/latest/download/<name>-charts.zip
# A v* tag also publishes the container image under its semver tags (ci.yaml -> image.yaml).
# Versions are calendar versions, YY.MM.N: the year and month of the release (the month
# unpadded) and N, from 0, the month's release count. Tags are cut by hand (liveries/README.md,
# "Release") and never moved: another release in the month is the next N, so this refuses a tag
# whose release exists, or whose month is still to come. The tag must be the engine's version,
# `version:` in _extensions/engine/_extension.yml, and CHANGELOG.md must have its entry, which
# becomes the release's notes.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the engine's version, new, with a changelog entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(sed -n 's/^version: *//p' _extensions/engine/_extension.yml)
          echo "engine $v, tag $GITHUB_REF_NAME"
          test "v$v" = "$GITHUB_REF_NAME"
          if ! [[ "$v" =~ ^([0-9]{2})\.([1-9]|1[0-2])\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::$v is not a calendar version YY.MM.N (the month unpadded)"; exit 1
          fi
          if (( 10#${BASH_REMATCH[1]} * 100 + BASH_REMATCH[2] > 10#$(date -u +%y) * 100 + 10#$(date -u +%m) )); then
            echo "::error::$v is a month still to come"; exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME exists: a tag is never re-cut; a fix is a new patch release"; exit 1
          fi
          # the entry: from its "## [x.y.z]" heading to the next release's
          awk -v h="## [$v]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no ## [$v] entry"; exit 1
          fi

      # make overleaf and charts-zip need only python3 and the engine (no conda, no quarto);
      # the charts bundle's contact sheet needs Pillow (the runner's own python refuses pip)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the zips, two per livery
        run: |
          python -m pip install --quiet pillow pyyaml
          for d in liveries/*/; do
            make -C decks/quickstart overleaf charts-zip LIVERY="$(basename "$d")"
          done
          ls -l decks/quickstart/*-overleaf.zip decks/quickstart/*-charts.zip

      # the notes: the changelog's entry, then the image's tags (the same tag has ci.yaml publish
      # the build-environment image under its semver tags, image.yaml)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          printf '\nContainer image (the framework with its build environment, README "Building in the container"): `ghcr.io/%s:%s`, also `:%s` and `:%s`.\n' \
            "$GITHUB_REPOSITORY" "$v" "${v%.*}" "${v%%.*}" >> notes.md
          gh release create "$GITHUB_REF_NAME" decks/quickstart/*-overleaf.zip decks/quickstart/*-charts.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
