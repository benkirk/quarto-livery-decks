# Pushing a tag v* publishes a GitHub Release carrying one Overleaf/pure-LaTeX project zip
# per livery under docs/common/liveries/, at the stable URLs the README links:
#   https://github.com/benkirk/quarto-livery-decks/releases/latest/download/<name>-overleaf.zip
# Tags are cut by hand after a livery change, or moved while a change stays backwards
# compatible (README "Adding a livery", step 6).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # make overleaf needs only python3 and the vendored engine (no conda, no quarto)
      - name: Build one zip per livery
        run: |
          for d in docs/common/liveries/*/; do
            make -C docs/quickstart overleaf LIVERY="$(basename "$d")"
          done
          ls -l docs/quickstart/*-overleaf.zip

      # a moved tag (re-cut while a change stays backwards compatible) replaces the
      # existing release's zips instead of failing on it
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" docs/quickstart/*-overleaf.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" docs/quickstart/*-overleaf.zip --title "$GITHUB_REF_NAME" --generate-notes
          fi
