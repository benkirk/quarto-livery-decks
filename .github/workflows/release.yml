# Pushing a tag v* publishes a GitHub Release carrying, per livery under liveries/, one
# Overleaf/pure-LaTeX project zip and one charts bundle (matplotlib in the livery), at the stable
# URLs the README links:
#   https://github.com/benkirk/quarto-livery-decks/releases/latest/download/<name>-overleaf.zip
#   https://github.com/benkirk/quarto-livery-decks/releases/latest/download/<name>-charts.zip
# A v* tag also publishes the container image under its semver tags (ci.yaml -> image.yaml).
# Tags are cut by hand after a livery change, or moved while a change stays backwards
# compatible (README "Adding a livery", step 6). The tag must be the engine's version:
# `version:` in _extensions/engine/_extension.yml (one number since #57).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the engine's version
        run: |
          v=$(sed -n 's/^version: *//p' _extensions/engine/_extension.yml)
          echo "engine $v, tag $GITHUB_REF_NAME"
          test "v$v" = "$GITHUB_REF_NAME"

      # make overleaf and charts-zip need only python3 and the engine (no conda, no quarto);
      # the charts bundle's contact sheet needs Pillow (the runner's own python refuses pip)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the zips, two per livery
        run: |
          python -m pip install --quiet pillow pyyaml
          for d in liveries/*/; do
            make -C decks/quickstart overleaf charts-zip LIVERY="$(basename "$d")"
          done
          ls -l decks/quickstart/*-overleaf.zip decks/quickstart/*-charts.zip

      # a moved tag (re-cut while a change stays backwards compatible) replaces the
      # existing release's zips instead of failing on it
      # the same tag has ci.yaml publish the build-environment image under its semver tags
      # (image.yaml); the notes name them
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${GITHUB_REF_NAME#v}
          notes="Container image (the framework with its build environment, README \"Building in the container\"): \`ghcr.io/$GITHUB_REPOSITORY:$v\`, also \`:${v%.*}\` and \`:${v%%.*}\`."
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" decks/quickstart/*-overleaf.zip decks/quickstart/*-charts.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" decks/quickstart/*-overleaf.zip decks/quickstart/*-charts.zip --title "$GITHUB_REF_NAME" --generate-notes --notes "$notes"
          fi
