# Every check, in one pass: the image (image.yaml: native amd64 and arm64 builds, each
# smoke-tested as a plain user with a bind-mounted deck directory, merged into one manifest
# list), then the deck checks INSIDE that image, at its digest: the sample, quickstart,
# fixture and plots decks; a hello-world deck in a consumer's layout (the framework one level down, as
# a submodule would be: docs/other-repos.md); and every livery
# under liveries/ (`make LIVERY=<name>`, the engine's checks, `make qa`, the
# Overleaf zip compiled and the charts bundle tried in a clean directory, the compositions measured). A new livery joins
# by existing. The `latex` job builds the engine's pure-LaTeX examples and runs its tests. Container jobs run as root with GitHub's default `bash -eo pipefail`.
# `runtimes` (runtimes.yaml) runs the image under Apptainer and rootless Podman, as HPC users do.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  # every PR, docs-only ones too: main requires these checks (branch protection), and a PR whose
  # workflow is skipped by paths-ignore would wait for them forever
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# a newer push supersedes a PR's run, never main's
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  image:
    name: Image
    uses: ./.github/workflows/image.yaml
    permissions:
      contents: read
      packages: write

  # the image under Apptainer (amd64, arm64) and rootless Podman, pulled anonymously
  runtimes:
    name: Runtimes
    needs: image
    if: needs.image.outputs.digest != ''
    uses: ./.github/workflows/runtimes.yaml
    with:
      image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}

  # -----------------------------------------------------------------------
  # the sample (the cookbook), quickstart (the README's exemplar), fixture and plots decks
  # -----------------------------------------------------------------------
  sample:
    name: Build the sample, quickstart, fixture and plots decks
    needs: image
    if: needs.image.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # Quarto only treats YAML as front matter when it is the very first thing in the
      # file; anything above it (an editor mode-line) leaves `date: last-modified`
      # unresolved (#7).
      - name: Check deck front matter starts on line 1
        run: |
          bad=0
          for f in decks/*/*.qmd; do
            case "$(basename "$f")" in _*) continue ;; esac   # included fragments
            first=$(head -n1 "$f")
            if [ "$first" = "---" ]; then
              echo "ok    $f"
            else
              echo "FAIL  $f: line 1 is '$first', expected '---'"
              echo "::error file=$f,line=1::front matter must start on line 1"
              bad=1
            fi
          done
          exit "$bad"

      - name: Check the committed liveries are built
        run: python3 _extensions/engine/livery.py build --check liveries/*/

      # timeout: a wedged browser render (mermaid) should fail here in minutes, with
      # diagnostics, not at the job's cap
      - name: Build the sample pptx
        run: |
          timeout 600 make -C decks/sample pptx || {
            echo '::error::sample pptx render timed out or failed'
            ps aux | grep -i chrom | grep -v grep || true
            exit 1
          }

      - name: Check dates resolved in sample.pptx
        run: |
          if unzip -p decks/sample/sample.pptx 'ppt/slides/*.xml' | grep -c '<a:t>last-modified</a:t>' >/dev/null; then
            echo '::error::sample.pptx contains a literal "last-modified" date (#7)'
            exit 1
          fi

      - name: Build the sample HTML
        run: timeout 600 make -C decks/sample html

      # the engine revealjs theme applied: its fonts/logos dependency is attached and the
      # Lua filter drew the waves (a stock revealjs render has neither)
      - name: Check sample.html carries the engine theme
        run: |
          cd decks/sample
          grep -q 'livery.css' sample.html
          grep -q 'class="engine-waves"' sample.html
          ls sample_files/libs/quarto-contrib/engine-revealjs-*/Poppins-Bold.ttf

      - name: Build the sample PDF
        run: timeout 600 make -C decks/sample pdf

      # ::: note (docs/authoring.md "Notes under a figure"): HTML's .engine-note, the PDF's text,
      # and in pptx centred lines at the caption size; "Image embed" keeps its remark, which the
      # fold into a captioned figure used to drop
      - name: Check the sample's notes
        run: |
          cd decks/sample
          grep -q 'class="engine-note"' sample.html
          pdftotext sample.pdf - | grep -c 'One short label a box keeps' >/dev/null   # -q: SIGPIPE under pipefail
          python3 - <<'EOF'
          import json
          from pptx import Presentation
          from pptx.enum.text import PP_ALIGN
          cap = json.load(open("_livery/build/livery.json"))["type"]["roles"]["caption"]["pt"]
          notes = [p for s in Presentation("sample.pptx").slides for sh in s.shapes if sh.has_text_frame
                   for p in sh.text_frame.paragraphs
                   if p.text.startswith(("One short label a box keeps", "Width can also be set"))]
          assert len(notes) == 2, [p.text for p in notes]
          for p in notes:
              assert p.alignment == PP_ALIGN.CENTER and all(r.font.size.pt == cap for r in p.runs), p.text
          EOF

      # the exemplar deck the README's screenshots come from, and the fixture decks (a photo
      # title, the light title, both, the deck-wide size step), in every format
      - name: Build the quickstart and fixture decks
        run: |
          timeout 900 make -C decks/quickstart all
          timeout 900 make -C decks/fixtures all

      # every notes slide carries the color map PowerPoint writes; Keynote refuses a deck with
      # one that lacks it (notes_clrmap.py)
      - name: Check the decks' notes slides
        run: |
          for f in decks/sample/sample.pptx decks/quickstart/quickstart.pptx; do
            n=$(unzip -Z1 "$f" | grep -c '^ppt/notesSlides/notesSlide[0-9]*\.xml$')
            c=$(unzip -p "$f" 'ppt/notesSlides/notesSlide*.xml' | grep -o '<p:clrMapOvr>' | wc -l)
            echo "$f: $n notes slides, $c with a color map"
            test "$n" -gt 0 && test "$n" -eq "$c"
          done

      # the plots cookbook (jupyter: python3, matplotlib and seaborn in the livery), every format
      # and its QA; the HTML's plots are SVG paths sized to the canvas, the PDF embeds the livery font
      - name: Build and QA the plots deck
        run: |
          timeout 900 make -C decks/plots qa
          cd decks/plots
          ls plots_files/figure-revealjs/*.svg
          ls plots_files/figure-revealjs/*.png   # the raster() slide, the deck's one PNG in HTML
          if grep -l '<text' plots_files/figure-revealjs/*.svg; then echo '::error::SVG plot with <text>'; exit 1; fi
          grep -c 'class="engine-plot"' plots.html >/dev/null
          test "$(unzip -l plots.pptx | grep -c 'ppt/media/image')" -ge 10
          test "$(unzip -l plots.pptx | grep -c 'ppt/media/image.*\.svg')" -ge 9   # the plots, vector,
          test "$(unzip -p plots.pptx 'ppt/slides/*.xml' | grep -o 'asvg:svgBlip' | wc -l)" -ge 9   # each with a PNG
          pdffonts plots.pdf | grep -q Poppins

      - name: Upload the decks
        uses: actions/upload-artifact@v7
        with:
          name: sample-decks
          path: |
            decks/sample/sample.pptx
            decks/sample/sample.html
            decks/sample/sample_files/
            decks/sample/sample.pdf
            decks/quickstart/quickstart.pptx
            decks/quickstart/quickstart.html
            decks/quickstart/quickstart.pdf
            decks/fixtures/*.pdf
            decks/plots/plots.pptx
            decks/plots/plots.html
            decks/plots/plots_files/
            decks/plots/plots.pdf
          if-no-files-found: error
          retention-days: 14

  # -----------------------------------------------------------------------
  # a consumer's layout: the framework checked out one level down, as a submodule would
  # be, and a hello-world deck beside it that only includes Make.common
  # -----------------------------------------------------------------------
  consumer:
    name: Build a deck outside the framework
    needs: image
    if: needs.image.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      FRAMEWORK: consumer/docs/presentations/framework
      DECK: consumer/docs/presentations/hello

    steps:
      - name: Check out the framework where a submodule would be
        uses: actions/checkout@v7
        with:
          path: ${{ env.FRAMEWORK }}

      # what a consumer commits: a one-line Makefile and its deck
      - name: Write the hello-world deck
        run: |
          mkdir -p "$DECK"
          echo 'include ../framework/Make.common' > "$DECK/Makefile"
          cat > "$DECK/hello.qmd" <<'QMD'
          ---
          title: "Hello"
          subtitle: "A deck outside the framework"
          author: "CI"
          date: last-modified
          ---

          # Section

          The deck lives in the consumer's tree.

          ## A table

          | Format | Built by |
          |--------|----------|
          | pptx | pandoc and the post-render steps |
          | HTML | the engine revealjs theme |
          | PDF | the engine beamer theme |
          QMD

      - name: Build pptx and HTML
        run: timeout 600 make -C "$DECK" pptx html

      # each format really came from the framework: the pptx template's divider layout
      # (through _livery), and the revealjs theme (_extensions)
      - name: Check the framework was applied
        run: |
          cd "$DECK"
          ls -l _quarto.yml _extensions _livery
          unzip -p hello.pptx ppt/slideLayouts/slideLayout3.xml | grep -c 'name="Section Header"' >/dev/null
          unzip -p hello.pptx 'ppt/slides/*.xml' | grep -c 'engine-section-label' >/dev/null
          grep -q 'livery.css' hello.html

      # the static site: one shared libs/, references rewritten, an index
      - name: Build the site
        run: |
          make -C "$DECK" site SITE_NOINDEX=1
          cd "$DECK/_site"
          test -d libs/revealjs
          grep -q 'libs/revealjs' hello.html
          test "$(grep -c '_files/libs' hello.html)" -eq 0
          grep -q 'content="noindex"' hello.html
          grep -q 'hello.html' index.html

      - name: Build the PDF
        run: timeout 600 make -C "$DECK" pdf

      - name: Upload the hello-world deck
        uses: actions/upload-artifact@v7
        with:
          name: consumer-hello
          path: |
            ${{ env.DECK }}/hello.pptx
            ${{ env.DECK }}/hello.pdf
          if-no-files-found: error
          retention-days: 14

  # -----------------------------------------------------------------------
  # the engine's pure-LaTeX side (latex) and its tests: what beamer-livery-theme's own
  # CI checked before it merged here (#57). The liveries' build/ freshness is the sample
  # job's, their checks and each one's Overleaf zip the livery jobs'.
  # -----------------------------------------------------------------------
  latex:
    name: Build the LaTeX examples and test the engine
    needs: image
    if: needs.image.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v7

      # the resolved compositions against the decided numbers (a changed box is named in
      # EXPECTED_DELTAS or fails); every livery's sizes in whole or half points on its canvas,
      # and every size in its template a role's; an SVG picture's PNG fallback (svg_fallback.py); notes slides' color map (notes_clrmap.py);
      # every livery.yml valid against the schema, the
      # refusals with their paths, and liveries/REFERENCE.md generated from the schema; the
      # livery command's scaffolds (new, with a deck, a flavor) passing build, template and check;
      # bin/new-deck's decks, --bare too
      - name: Test the compositions, the type scale, the schema, the livery command, new-deck and the docs
        run: |
          python3 -m pytest -q tests/test_compositions.py
          python3 -m pytest -q tests/test_type.py
          python3 -m pytest -q tests/test_charts.py
          python3 tests/test_svg_fallback.py
          python3 tests/test_notes_clrmap.py
          python3 -m pytest -q tests/test_schema.py
          python3 tests/test_cli.py
          python3 tests/test_new_deck.py
          python3 tests/test_docs.py
          python3 _extensions/engine/livery.py schema --doc --check

      # the starter (talk.tex), the examples (template, paper, mathfonts, the Quarto demo) and
      # template.tex's brand, title, aspect-ratio, pdfTeX and math-font variants; the demo's
      # HTML too, the one deck on the default livery (no livery: key)
      - name: Build the starter deck, the examples and their variants
        run: timeout 1200 make -C latex default examples variants html

      - name: Check fonts are embedded
        run: |
          cd latex
          for f in talk.pdf examples/template.pdf examples/quarto-demo.pdf; do
            pdffonts "$f" | tee /dev/stderr | grep -c Poppins-Bold >/dev/null
          done

      # mathfont=serif by default: the equation page sets its math in a serif math font, not
      # Poppins Italic (that is what mathfont=poppins is for)
      - name: Check the math font
        run: |
          cd latex/examples
          pdffonts -f 4 -l 4 template.pdf | tee /dev/stderr | grep -c 'CMMath\|LatinModernMath' >/dev/null
          if pdffonts -f 4 -l 4 template.pdf | grep -c Poppins-Italic >/dev/null; then exit 1; fi   # (a `!` line mid-script never fails under -e)
          pdffonts -f 4 -l 4 template-mathpoppins.pdf | grep -c Poppins-Italic >/dev/null

      # the bundled liveries/ncar beside _extensions/ was found: its css attached, the waves drawn
      - name: Check the demo's HTML carries the theme
        run: |
          cd latex/examples
          grep -q 'livery.css' quarto-demo.html
          grep -q 'class="engine-waves"' quarto-demo.html
          ls quarto-demo_files/libs/quarto-contrib/engine-revealjs-*/Poppins-Bold.ttf

      - name: Upload the examples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: latex-examples
          path: |
            latex/talk.pdf
            latex/examples/*.pdf
            latex/examples/*.log
          retention-days: 14

  # -----------------------------------------------------------------------
  # every livery: the directory listing is the matrix
  # -----------------------------------------------------------------------
  liveries:
    name: List the liveries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      liveries: ${{ steps.ls.outputs.liveries }}
    steps:
      - uses: actions/checkout@v7
      - id: ls
        run: echo "liveries=$(ls -d liveries/*/ | xargs -n1 basename | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  livery:
    name: Check livery ${{ matrix.livery }}
    needs: [image, liveries]
    if: needs.image.outputs.digest != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ghcr.io/${{ github.repository }}@${{ needs.image.outputs.digest }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        livery: ${{ fromJson(needs.liveries.outputs.liveries) }}
    env:
      LIVERY: ${{ matrix.livery }}

    steps:
      - uses: actions/checkout@v7

      # the engine's checks (build/ fresh, every file the data names, the template's pandoc
      # compliance and that it rebuilds byte-identically from the data, contrast), then the
      # quickstart deck's `make qa LIVERY=`: all three formats, overflow, slide-count parity,
      # short slides, contact sheets in _qa/ (deck_qa.py)
      - name: Check the livery, then build and QA the quickstart deck under it
        run: timeout 1500 python3 _extensions/engine/livery.py check --qa "liveries/$LIVERY"

      # the livery reached the output: Make's link and stamp, the template's primary slot in
      # the theme, the embedded typeface, the livery's css in the HTML
      - name: Check the livery was applied
        run: |
          cd decks/quickstart
          test "$(basename "$(cat .livery)")" = "$LIVERY"   # the stamp holds the livery's directory
          test "$(basename "$(readlink _livery)")" = "$LIVERY"
          json=../../liveries/$LIVERY/build/livery.json
          primary=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['pptx']['scheme']['dk2'].lstrip('#'))" "$json")
          typeface=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['pptx']['typeface'])" "$json")
          embeds=$(python3 -c "import json,sys; print('fonts' in json.load(open(sys.argv[1]))['pptx'])" "$json")
          unzip -p quickstart.pptx ppt/theme/theme1.xml | grep -c "$primary" >/dev/null
          # a livery with font blobs (pptx.fonts) embeds them; one without names its typeface only
          test "$embeds" = False || unzip -p quickstart.pptx ppt/presentation.xml | grep -c "embeddedFontLst" >/dev/null
          # (a negated command never fails a `bash -e` step, so the absence is an explicit if)
          if [ "$embeds" = False ] && unzip -p quickstart.pptx ppt/presentation.xml | grep -c "embeddedFontLst" >/dev/null; then
            echo "::error::$LIVERY has no pptx.fonts but quickstart.pptx embeds fonts"; exit 1
          fi
          unzip -p quickstart.pptx ppt/theme/theme1.xml | grep -c "typeface=\"$typeface\"" >/dev/null
          grep -q 'livery.css' quickstart.html

      # the zip unpacked flat, no TEXINPUTS/TTFONTS: its latexmkrc alone must find the
      # theme, the livery's logos and its bundled fonts (never an installed one)
      - name: Pack and compile the Overleaf project
        run: |
          make -C decks/quickstart overleaf LIVERY="$LIVERY"
          rm -rf /tmp/overleaf && mkdir /tmp/overleaf && unzip -q "decks/quickstart/$LIVERY-overleaf.zip" -d /tmp/overleaf
          (cd /tmp/overleaf && env -u TEXINPUTS -u TTFONTS latexmk -xelatex -interaction=nonstopmode -halt-on-error talk.tex)
          family=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['typography']['fonts'][0]['family'])" "liveries/$LIVERY/build/livery.json")
          pdffonts /tmp/overleaf/talk.pdf | tee /dev/stderr | grep -c "${family// /}" >/dev/null
          if pdffonts /tmp/overleaf/talk.pdf | grep -c HelveticaNeue >/dev/null; then
            echo "::error::the Overleaf PDF uses an installed Helvetica Neue"; exit 1
          fi

      # the charts bundle unpacked alone, no framework on the paths: a script beside it plots in the
      # livery's colors and embeds its bundled font, registered from the bundle
      - name: Pack and try the charts bundle
        run: |
          make -C decks/quickstart charts-zip LIVERY="$LIVERY"
          rm -rf /tmp/charts && mkdir /tmp/charts && unzip -q "decks/quickstart/$LIVERY-charts.zip" -d /tmp/charts
          cat > /tmp/charts-plot.py <<'PY'
          import sys; sys.path.insert(0, "/tmp/charts")
          import json, os, livery_mpl, matplotlib.pyplot as plt
          from matplotlib import font_manager as fm
          L = json.load(open("/tmp/charts/livery.json"))
          # the bundle's files are registered under the family; the image also has the same files
          # installed (their cache entries win findfont's ties), which is the same face
          here = os.path.realpath("/tmp/charts/fonts")
          mine = {f.name for f in fm.fontManager.ttflist if os.path.realpath(f.fname).startswith(here)}
          assert L["typography"]["base"] in mine, mine
          fm.findfont(L["typography"]["base"], fallback_to_default=False)
          assert [c.upper() for c in plt.rcParams["axes.prop_cycle"].by_key()["color"]] == L["charts"][L["charts"]["mode"]]["categorical"]
          # the stamp: the engine that packed it, in the helper and its livery.json alike
          v = [l.split(":", 1)[1].strip() for l in open(os.environ["ENGINE_YML"]) if l.startswith("version:")][0]
          assert livery_mpl.__version__ == L["engine"] == v and L["schema"] == 1, (livery_mpl.__version__, L["engine"], v)
          assert all(hasattr(livery_mpl, n) for n in livery_mpl.__all__)
          fig, ax = plt.subplots(figsize=livery_mpl.figsize("half"))
          ax.plot([0, 1, 2], [0, 1, 3], label="a"); ax.set_xlabel("x"); ax.legend()
          fig.savefig("/tmp/charts-plot.pdf")
          print(L["typography"]["base"].replace(" ", ""))
          PY
          engine_yml="$PWD/_extensions/engine/_extension.yml"   # before the cd below
          family=$(cd /tmp && env -u LIVERY_DIR -u PYTHONPATH -u MATPLOTLIBRC ENGINE_YML="$engine_yml" python3 /tmp/charts-plot.py | tail -1)
          pdffonts /tmp/charts-plot.pdf | tee /dev/stderr | grep -c "$family" >/dev/null

      # the title, divider, closing and feature slides of every format against the livery's
      # compositions (comp_measure.py; pptx through the image's LibreOffice). Report-only
      # (MEASURE_FAIL empty) until the formats draw from the boxes; the sheet and table are uploaded
      - name: Measure the compositions
        run: timeout 900 make -C decks/fixtures measure LIVERY="$LIVERY" MEASURE_FAIL=

      - name: Upload the deck
        uses: actions/upload-artifact@v7
        with:
          name: quickstart-${{ matrix.livery }}
          path: |
            decks/quickstart/quickstart.pptx
            decks/quickstart/quickstart.html
            decks/quickstart/quickstart.pdf
            decks/quickstart/${{ matrix.livery }}-overleaf.zip
            decks/quickstart/${{ matrix.livery }}-charts.zip
            decks/quickstart/_qa/
            decks/fixtures/_qa/measure.tsv
            decks/fixtures/_qa/compositions-${{ matrix.livery }}.png
          if-no-files-found: error
          retention-days: 14
