# Monthly housekeeping with the workflow's own token: workflow runs older than 60 days, and
# the image versions nothing tags any more (every PR pushes its two platform images by
# digest; the merged index is what the pr-N / sha- tags keep).
name: Remove old Actions runs and untagged images (cron)

on:
  workflow_dispatch:
  schedule:
    # 3:43 UTC on the 11th of each month
    - cron: '43 3 11 * *'

permissions:
  actions: write
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Delete workflow runs older than 60 days
        run: |
          cutoff=$(date -u -d '60 days ago' +%F)
          gh run list --limit 1000 --created "<$cutoff" --json databaseId -q '.[].databaseId' \
            | tee /dev/stderr | xargs -r -n1 gh run delete

      - name: Delete untagged image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: quarto-livery-decks
          package-type: container
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 10
