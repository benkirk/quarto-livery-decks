project:
  type: default

quarto-required: ">=1.6.0"   # the engine beamer theme needs pandoc >= 3.2.1

# `date: last-modified` / `today` render as "September 29, 2026", not ISO
date-format: "MMMM D, YYYY"

# Strip quarto's raw-HTML <figure> wrappers in pptx output -- pandoc ignores
# them but counts them as text when choosing slide layouts, demoting a
# columns slide with a diagram to the Comparison layout (see the filter).
# slide-layout.lua: carries the per-slide layout controls to utils/slide_layout.py.
# notes-last.lua: speaker notes before a columns div split the pptx slide;
# moving every slide's notes to its end makes any placement safe.
# single-body.lua: content after a table or diagram splits the pptx slide;
# the paragraphs after one move into its caption, at the slide's foot.
# diagram-dark.lua: under a dark livery, the diagrams' PNGs recolored (pptx, PDF).
# Paths go through _engine/, Make.common's link to this directory, so they hold
# wherever the deck directory is (here, or in a repo using this as a submodule).
# _livery/ is Make.common's link to the brand's directory (LIVERY, default ncar).
filters:
  - _engine/strip-raw-figure.lua
  - _engine/slide-layout.lua   # pptx: the theme's .center/scale= etc. as a notes line
  - _engine/notes-last.lua
  - _engine/single-body.lua    # pptx: after notes-last
  - _engine/linked-images.lua   # [![](x.png)](url): a link line on the slide
  - _engine/diagram-dark.lua    # a dark livery: baked mermaid/graphviz PNGs turned to the dark

livery: _livery   # how the engine's Lua filters will find the livery (design section 5)

format:
  pptx:
    reference-doc: _livery/template.pptx
    highlight-style: _livery/build/livery.theme   # the livery's code colors, as HTML and PDF wear them
    slide-level: 2
    toc: false
    fig-format: png       # plots: pixels, enough for a projector at the canvas size
    fig-dpi: 200
  engine-beamer:           # engine beamer theme, in the repo's _extensions/engine
    highlight-style: _livery/build/livery.theme   # the livery's code colors (its default is ncar's)
    toc: false
    fontsize: 10pt        # ~pptx text density; beamer has no autofit
    themeoptions: [fonts=bundled]  # bundled Poppins; skip the system-font probe
    fig-format: pdf       # plots: vector, the livery's font embedded (livery.mplstyle pdf.fonttype)
    fig-dpi: 200          # what a vector plot rasterizes (imshow, rasterized=True)
  engine-revealjs:         # engine revealjs (HTML) theme, same extension
    highlight-style: _livery/build/livery.theme
    toc: false
    fig-format: svg       # plots: vector, text as paths (an <img> cannot see the page's fonts)
    fig-dpi: 96
    # footer: "Deck title | CISL"   # small text, bottom center
    # embed-resources: true         # one self-contained .html (needs chalkboard: false)
    # chalkboard: false

# Mermaid diagrams render to PNG automatically during quarto render
diagram:
  mermaid:
    theme: default
