project:
  type: default

quarto-required: ">=1.6.0"   # the engine beamer theme needs pandoc >= 3.2.1

# `date: last-modified` / `today` render as "September 29, 2026", not ISO
date-format: "MMMM D, YYYY"

# The engine's formats carry their filters (_extensions/engine/_extension.yml).
# _livery/ is Make.common's link to the brand's directory (LIVERY, default ncar).
livery: _livery   # how the engine's Lua filters will find the livery (design section 5)

format:
  engine-pptx:             # engine pptx format, same extension
    reference-doc: _livery/template.pptx
    highlight-style: _livery/build/livery.theme   # the livery's code colors, as HTML and PDF wear them
    fig-format: svg       # plots: vector, each with a PNG fallback at fig-dpi (svg_fallback.py)
    fig-dpi: 200          # (beamer keeps Quarto's pdf at 300 dpi, which sizes its diagrams)
  engine-beamer:           # engine beamer theme, in the repo's _extensions/engine
    highlight-style: _livery/build/livery.theme   # the livery's code colors (its default is ncar's)
    toc: false
    fontsize: 10pt        # ~pptx text density; beamer has no autofit
    themeoptions: [fonts=bundled]  # bundled Poppins; skip the system-font probe
  engine-revealjs:         # engine revealjs (HTML) theme, same extension
    highlight-style: _livery/build/livery.theme
    toc: false
    fig-format: svg       # plots: vector, text as paths (an <img> cannot see the page's fonts)
    # footer: "Deck title | CISL"   # small text, bottom center
    # embed-resources: true         # one self-contained .html (needs chalkboard: false)
    # chalkboard: false
diagram:                   # mermaid diagrams render to PNG during quarto render
  mermaid:
    theme: default
