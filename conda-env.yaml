name: quarto_docs
channels:
  - conda-forge
dependencies:
  # Binaries / runtime — must come from conda.
  - python
  - quarto >=1.6   # engine-beamer's Lua filter uses \pandocbounded (pandoc >= 3.2.1)
  - gh
  - make
  - pip
  - poppler      # pdftoppm / pdftotext, for `make qa`
  - librsvg      # rsvg-convert: an SVG plot's PNG fallback in pptx (pptx_steps/svg_fallback.py)
  # Pure-python deps install much faster as wheels via pip than via the
  # conda solver, and don't add to the solve graph.
  - pip:
      - bash_kernel
      - ipykernel
      - jsonschema    # livery_build.py validates livery.yml (_extensions/engine/livery.schema.json)
      - jupyter_client
      - matplotlib    # plots in the livery (build/livery.mplstyle, the engine's mpl/livery_mpl.py)
      - nbclient
      - nbformat
      - numpy
      - pandas
      - pillow        # `make qa` contact sheets
      - pipdeptree
      - playwright    # `make qa` HTML checks (Makefile installs its headless Chromium)
      - pytest        # a deck's own Python tests, and the framework's (tests/, make test)
      - pytest-xdist  # the tests in parallel (make test: -n auto)
      - python-pptx
      - pyyaml
      - scipy
      - seaborn
