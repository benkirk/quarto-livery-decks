# Engine knobs the brand.yml standard has no slot for. Role values are palette names from
# _brand.yml or hex. Geometry is in fractions of the slide; today's numbers come from
# beamerouterthemeEngine.sty, engine-revealjs.scss (1600x900 slide px), section_subtitle.py and
# deck_qa.py, and must agree with them until Phase 2 makes them the one source.
name: ncar
extends: null

roles:
  primary-text: white           # text on primary
  primary-contrast: ncar-blue   # primary as small text on white
  accent: orange
  highlight: ucar-aqua-contrast   # a second small-text accent on white: examples, tips, strings (Brand Guide p18)
  muted: "#6B7C99"              # $ncar-muted: HTML, pptx; the PDF's CoolGray7 (#6686AF) joins it in Phase 2
  surface: light-gray
  warning: yellow
  dark: space

derived:                  # blends livery_build.py computes from the roles (BLENDS); a key here overrides
  alert-text: "#B5540A"   # warnings and errors in code: the theme's dark orange, not a blend

aspect: "16:9"

geometry:                 # fractions of the slide (of its width: margin, tab, full.pad)
  margin: 0.06            # 96 px of 1600; deck_qa.py's overflow edge is 1 - margin
  tab: 0.018              # 29 px; the divider's accent tab
  logo:
    height: 0.0644        # content slides: 58 px of 900 (beamer drew 0.06 before Phase 2)
    top: 0.0533           # 48 px
    aspect: 3.934         # NSF NCAR lockup, 1200/305
    title: 0.09           # the lockup on the title, section and closing slides (beamer's sizes;
    section: 0.08         # HTML drew 70, 58 and 58 px before Phase 2)
    closing: 0.10
  divider:                # the section slide's block: padding above and below (120 / 80 px);
    top: 0.1333           # section_subtitle.py centers the pptx block in the same band
    bottom: 0.0889
  full:                   # the full-figure slide: margin round the figure, footline, caption line
    pad: 0.025
    floor: 0.075
    caption: 0.06
  body-sizes-pt: [20, 18, 16, 14, 12]   # the master's ladder; autofit must never fire

divider:
  label: Section          # "Section n" eyebrow over the title; each format sets it in capitals
  tab: true

art:                      # backgrounds. waves: the brand's lines, drawn by the engine in the roles'
  waves:                  # colors (tools/fit-waves.py fits them); or a file per slide kind (title,
    shift:                # section, closing, content) placed as the background instead
      title: 0.20         # how far right of the cover art's position each slide kind draws them
      section: 0.26
      content: 0.27
    lines:                # each two cubics from the top edge to the bottom edge: [x, y] fractions
      - [[0.4862, 0.0000], [0.5087, 0.1976], [0.6068, 0.4965], [0.6068, 0.6766], [0.6068, 0.8741], [0.5756, 0.9681], [0.5674, 1.0000]]
      - [[0.5138, 0.0000], [0.5402, 0.1583], [0.6570, 0.4747], [0.6570, 0.6423], [0.6570, 0.8307], [0.6286, 0.9166], [0.6000, 1.0000]]
      - [[0.5427, 0.0000], [0.5762, 0.1381], [0.7073, 0.4410], [0.7073, 0.6182], [0.7073, 0.8242], [0.6639, 0.9245], [0.6320, 1.0000]]

latex:                    # build/livery.sty: the palette's LaTeX color names (default: CamelCase of the key)
  colors:
    ncar-blue: NCARBlue
    dark-blue: DarkBlue
    ucar-aqua: UCARAqua
    ucar-aqua-contrast: UCARAquaContrast
    space: Space
    light-blue: LightBlue
    light-aqua: LightAqua
    light-gray: LightGray
    white: BrandWhite
    orange: BrandOrange
    yellow: BrandYellow

pptx:
  template: template.pptx
  typeface: Poppins
  fonts: fonts/pptx       # <typeface>-{regular,bold,italic,bolditalic}.fntdata, embed_fonts.py
  # scheme: the theme1.xml slots follow the roles (livery_build.py's SLOT_ROLES); set one here to override
